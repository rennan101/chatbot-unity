<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComboBoy Researcher</title>
    <!-- Favicon com a Logo Combogó (SVG) -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/combogo_icon.svg?v=2">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN (Sobrepõe tudo até logar) -->
<div id="login-overlay" class="modal-overlay" style="display: flex; background: rgba(13, 17, 23, 0.95);">
    <div class="modal-content" style="text-align: center;">
        <img src="assets/icons/combogo_icon.svg" alt="Logo Combogó" style="width: 90px; height: 90px; margin-bottom: 15px; border-radius: 12px; object-fit: cover;">
        <h2 style="margin-bottom: 5px;">Bem-vindo ao <span style="color: #F58220;">ComboBoy</span> Researcher</h2>
        <p style="color: #8b949e; margin-bottom: 25px; font-size: 0.9rem;">Faça login para acessar seus projetos</p>
        
        <input type="email" id="email-input" placeholder="E-mail" style="margin-bottom: 15px;">
        <input type="password" id="senha-input" placeholder="Senha" style="margin-bottom: 20px;">
        
        <button id="btn-login-email" class="btn-confirmar" style="width: 100%; margin-bottom: 10px;">Entrar com E-mail</button>
        <button id="btn-cadastro-email" class="btn-cancelar" style="width: 100%; margin-bottom: 20px;">Criar Conta</button>
        
        <div style="display: flex; align-items: center; margin: 15px 0; color: #8b949e; font-size: 0.8rem;">
            <hr style="flex: 1; border-color: rgba(255,255,255,0.1);"> <span style="padding: 0 10px;">OU</span> <hr style="flex: 1; border-color: rgba(255,255,255,0.1);">
        </div>

        <button id="btn-login-google" class="btn-cancelar" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Entrar com Google
        </button>
    </div>
</div>
    <!-- Interface Principal (Oculta no início) -->
    <div id="app-interface" style="display: none; width: 100%; height: 100%;">
        <aside id="sidebar">
            <div class="sidebar-top" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0;">
                <div style="display: flex; align-items: center; gap: 8px;" id="brand-header">
                    <img src="assets/icons/combogo_icon.svg" alt="Logo" style="width: 30px; height: 30px; border-radius: 6px; object-fit: cover;">
                    <span style="font-weight: 700; font-size: 1rem; color: #F58220;" class="texto-btn">ComboBoy</span>
                </div>
                <button id="btn-toggle-sidebar" onclick="alternarSidebar()" title="Recolher/Expandir menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
            </div>

            <div class="sidebar-header">
                <button class="btn-novo-projeto" onclick="abrirModal()">
                    <span class="icone-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>
                    <span class="texto-btn">Novo Projeto</span>
                </button>
            </div>
            
            <div id="lista-projetos"></div>

            <div class="sidebar-footer" style="flex-direction: column; gap: 10px; display: flex;">
                <button id="btn-config" class="btn-config" onclick="abrirConfigMenu(event)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span class="texto-btn">Configurações</span>
                </button>
                <button id="btn-logout" class="btn-config" style="color: #ff7b72;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span class="texto-btn">Sair</span>
                </button>
            </div>
        </aside>

        <main id="main-area">
            <header id="chat-header">ComboBoy Researcher</header>
            <div id="chat"><div id="sem-conversa-msg">Selecione uma conversa ao lado ou crie um novo projeto para começar.</div></div>
            <div id="input-container">
                <div class="input-wrapper">
                    <textarea id="mensagem" rows="1" placeholder="Pergunta... (Pressione Shift + Enter para quebrar linha)" onkeydown="lidarComTecla(event)" oninput="ajustarAltura(this); validarInput();"></textarea>
                    <button id="btn-acao" class="btn-acao-moderno enviar" onclick="lidarComAcao()" disabled>
                        <svg id="icon-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        <svg id="icon-stop" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
                    </button>
                </div>
            </div>
        </main>
        
        <div id="context-menu"></div>
        <div id="config-menu"><div class="config-item"><span>Perguntar onde salvar projeto e conversas</span><label class="switch"><input type="checkbox" id="toggle-ask-save" onchange="salvarPreferenciasConfig()"><span class="slider"></span></label></div></div>
        <div class="modal-overlay" id="modal-projeto"><div class="modal-content"><h3>Novo Projeto Unity</h3><input type="text" id="input-nome-projeto" onkeypress="if(event.key === 'Enter') confirmarProjeto()"><div class="modal-acoes"><button class="btn-cancelar" onclick="fecharModal()">Cancelar</button><button class="btn-confirmar" onclick="confirmarProjeto()">Criar</button></div></div></div>
        <div class="modal-overlay" id="modal-renomear"><div class="modal-content"><h3 id="titulo-modal-renomear">Renomear</h3><input type="text" id="input-nome-renomear" onkeypress="if(event.key === 'Enter') confirmarRenomear()"><div class="modal-acoes"><button class="btn-cancelar" onclick="fecharModalRenomear()">Cancelar</button><button class="btn-confirmar" onclick="confirmarRenomear()">Salvar</button></div></div></div>
        <div id="toast"><span id="toast-icon"></span><span id="toast-msg"></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
